<!DOCTYPE html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title> 
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <style>
        .maindiv{

        }
        .content{
            display: flex;
            border: 1px black;
            position: relative;
            padding: 10px;
            margin: 10px;
        }
        .content span{
            padding: 20px;
            margin: 10px;
        }
        
        .hoverdiv{
            position: absolute;
            border: 1px solid;
            top: 44px;
             left: 0px;
               padding: 0px 20px;
               display: none;

        }
        .parentspan:hover .hoverdiv{
             display: block;
        }
        .parentspan{
            position: relative;
        }
        .hoverdiv:hover >p{
            background-color: aqua;
        }
    </style>
    <body>
        <div class="maindiv">
        <div class="content">
            <span> services</span>
            <span>contact us</span>
            <span>about us</span>
            <span class="parentspan">company

                <div class="hoverdiv">
                    <p>who we are</p>
                    <p>leadership</p>
                    <p>blog</p>
                </div>
            </span>
        </div>
        </div>

    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial scale=1.0"/>
        <title> tenzin </title>      
     <style>
        .header {
    width: 100%;
    padding :20px 30px;
    
}
</style>
    </head>
    <body>
        <h1>Form Page</h1>
        <form action="./app.js" autocomplete="on" novalidate>
            <fieldset>
                <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" value="tenzin" placeholder="enter name" id="name" name="name"> <br> <br>
            <label for="password">password:</label>
            <input type="password" value="tenzin" placeholder="enter your password" id="password" name="password"><br> <br>
            <label for="age">age:</label>
            <input type="number" value="20" placeholder="enter age" id="age" name="age"><br> <br>
            <label for="gender">gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="others" name="gender" value="others">
            <label for="others">Others</label>
            <br> <br>

            <P>CHOOSE LANGUAFE YOU KNOW</P>
            <input type="checkbox"  name="languages" id="html">
            <label for="html"> html</label><br>

            <input type="checkbox"  name="languages" id="css">
            <label for="css"> css</label><br>  

            <input type="checkbox"  name="languages" id="javascript">
            <label for="javascript"> javascript</label><br>

            <input type="checkbox"  name="languages" id="python">
            <label for="python"> python</label><br><br>
            
            <h2>SELECT YOUR LANGUAGE</h2>
            <br>    

            <label for="lang">language :</label>
            <select name="language" id="lang">   
                <option value="html">html</option>
                <option value="css">css</option>
                <option value="javascript">javascript</option>
                <option value="python">python</option>
            </select> <br> <br>

            <input type="submit" value="submit">
            <button type="reset">reset</button> <br> <br>
            <label for="comment">Comment:</label><br>
            <textarea name="comment" id="comment" rows="4" cols="50">enter your suggestions here...</textarea> <br> <br>
            </fieldset>

            <fieldset>
                <legend>Additional Information</legend>
                <label for="">choose yr color:</label>
                <input type="color" name="" id="">
                <br> <br>
                <label for="">choose yr date:</label>
                <input type="date" name="" id="" min="2010-01-01" max="2027-01-01">
                <input type="week" name="" id="">
                <input type="email" name="" id="" placeholder="enter ur email">
                <input type="tel" name="" id="" placeholder="enter ur phone number">
                <input type="age" name="" id="" placeholder="number"min="1" max="100">
                <input type=file name="" id="">
                <br> <br>
                <label for="">brightness:</label>
                <input type="range" name="" id="" min="0" max="100">    <br> <br>
                <input type="search" name="" id="" placeholder="search here"> <br> <br>
                <input type="url" name="" id="" placeholder="enter url"> <br> <br>
                <input type="submit">
                <input type="reset">
            </fieldset>
        </form>
    </body>
</html>
